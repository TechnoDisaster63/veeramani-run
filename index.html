  far:'rgba(96,128,160,0.30)', mid:'#dcc79f', midDark:'#c9b086',

};

/* ---------- assets ---------- */
const headImg = new Image();
let headReady=false;
headImg.onload=()=>{headReady=true;};
headImg.src = 'data:image/png;base64,'+HEAD_B64;
const meme = new Audio('audio.mp3'); meme.preload='auto';
const meme2 = new Audio('audio2.mp3'); meme2.preload='auto';
/* single-channel voice manager: only one voice note can play at a time.
   playVoice(a, cut) - cut=true stops whatever is playing first (catch line wins);
   cut=false only starts when the channel is idle (milestone replays). */
let voiceCur = null;
function stopVoice(){
  if(voiceCur){ try{ voiceCur.pause(); voiceCur.currentTime=0; }catch(e){} }
  voiceCur=null;
}
function playVoice(a, cut){
  if(muted) return;
  if(voiceCur && !voiceCur.paused && !voiceCur.ended){
    if(!cut) return;             // busy: idle-only request dropped, no overlap
    stopVoice();                 // priority request cuts the current one
  }
  try{ a.currentTime=0; a.play().catch(()=>{}); voiceCur=a; }catch(e){}
}
let muted=false;
const muteBtn=document.getElementById('muteBtn');
muteBtn.addEventListener('click',(e)=>{e.stopPropagation();muted=!muted;meme.muted=muted;meme2.muted=muted;muteBtn.innerHTML=muted?'&#128263;':'&#128266';});

/* ---------- tiny synth ---------- */
let AC=null;
function beep(f,d,type,vol){
  if(muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'square'; o.frequency.value=f;
    g.gain.setValueAtTime(vol||0.08, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+d);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+d);
  }catch(e){}
}
function honk(){ beep(196,0.16,'square',0.09); setTimeout(()=>beep(165,0.22,'square',0.09),140); }
function whoosh(){ beep(1200,0.28,'sawtooth',0.05); setTimeout(()=>beep(500,0.3,'sawtooth',0.04),90); }

const BRANDS=[
  {name:'Flipkart', body:'#1f6fd6', box:'#f8d210', cap:'#1f6fd6'},
  {name:'Amazon',   body:'#232f3e', box:'#ff9900', cap:'#232f3e'},
  {name:'Swiggy',   body:'#f2660b', box:'#7a3c00', cap:'#f2660b'},

];

/* ---------- game state ---------- */
const ST={MENU:0,PLAY:1,OVER:2};
let state=ST.MENU, tGlobal=0;
let speed, dist, cash, best=+(localStorage.getItem('vmrun_best')||0);
let gap, chaserCount, player, obstacles, coins, floats, bubbles, buses, jets, dust;
let spawnT, coinT, shakeT, invulnT, milestone, busT, jetT, hidden, hideCool, sayCool, coinStreak;
let clouds=[], skyline=[], blocks=[];
for(let i=0;i<5;i++) clouds.push({x:Math.random()*1200,y:40+Math.random()*120,s:0.6+Math.random()*0.9,v:8+Math.random()*10});
for(let i=0;i<16;i++) skyline.push({x:i*120+Math.random()*50,w:60+Math.random()*70,h:50+Math.random()*140});
for(let i=0;i<12;i++) blocks.push({x:i*190+Math.random()*70,w:110+Math.random()*70,h:60+Math.random()*90});

function reset(){
  speed=260; dist=0; cash=0;
  gap=380; chaserCount=1;
  player={x:0,y:GROUND,vy:0,jumps:0,run:0};
  obstacles=[]; coins=[]; floats=[]; bubbles=[]; buses=[]; jets=[]; dust=[];
  spawnT=1.2; coinT=2.0; shakeT=0; invulnT=0; milestone=500;
  busT=6; jetT=9; hidden=false; hideCool=0; sayCool=0; coinStreak=0;
}
function px(){ return Math.round(W*0.30); }

function addFloat(txt,x,y,color,big){
  floats.push({txt,x,y,color:color||'#fff',life:1.4,big:!!big});
}
function say(txt){
  if(sayCool>0) return;
  sayCool=2.6;
  bubbles.push({txt,life:2.2});
}

const GAGS=['COD \u20B9999 DUE!','PAYMENT PENDING!','Sir, COD sir!','Cash or UPI?!'];
const HIT_GAGS={
  box:'COD parcel adi! \uD83D\uDCE6', tv:'TV-ya idichutte! \uD83D\uDCFA',
  fridge:'Fridge-la mothitaa! \uD83E\uDDCA', tank:'Tank mela yeri vizhundha! \uD83D\uDEA9',
  bar:'Barricade thaandala! \uD83D\uDEA7', hole:'Pothole-la vizhundhutte! \uD83D\uDE2D',
  jet:'Low jet-la mothitaa! \u2708\uFE0F'
};

function startGame(){
  reset(); state=ST.PLAY;
  say('Odu, odu! \uD83C\uDFC3');
  playVoice(meme, true);
}
function gameOver(){
  state=ST.OVER;
  stopVoice();
  playVoice(meme2, true);
  if(dist>best){best=Math.floor(dist);localStorage.setItem('vmrun_best',best);}
  beep(140,0.5,'sawtooth',0.12); beep(90,0.8,'sawtooth',0.10);
}

/* ---------- input ---------- */
function press(){
  if(state===ST.MENU){ startGame(); return; }
  if(state===ST.OVER){ if(tGlobal-overT>0.6) startGame(); return; }
  if(player.y>=GROUND-0.5){ player.vy=-780*S; player.jumps=1; beep(520,0.09,'square',0.06); }
  else if(player.jumps<2){ player.vy=-680*S; player.jumps=2; beep(660,0.08,'square',0.05); }
}
let overT=0;
window.addEventListener('touchstart',(e)=>{e.preventDefault();press();},{passive:false});
window.addEventListener('mousedown',(e)=>{if(e.target!==muteBtn)press();});
window.addEventListener('keydown',(e)=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();press();}});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ if(voiceCur && !voiceCur.paused){ voiceCur.pause(); voiceCur._wasPlaying=true; } }
  else if(voiceCur && voiceCur._wasPlaying && !muted){ voiceCur._wasPlaying=false; voiceCur.play().catch(()=>{}); }
});

/* ---------- spawning ---------- */
function spawnObstacle(){
  const pool=[['box',0.26],['hole',0.12],['bar',0.12],['tv',0.16],['fridge',0.14],['tank',0.20]];
  let r=Math.random(), pick='box', acc=0;
  for(const [t,wgt] of pool){ acc+=wgt; if(r<acc){ pick=t; break; } }
  if(pick==='tank' && dist<260) pick='tv';
  if((pick==='fridge'||pick==='tv') && dist<120) pick='box';
  if(pick==='box'){
    const n = Math.random()<0.25 && speed>380 ? 2 : 1;
    obstacles.push({type:'box', x:W+120, w:46*S, h:44*S*n, n, tag:'\u20B9999'});
  } else if(pick==='hole'){
    obstacles.push({type:'hole', x:W+120, w:74*S, h:14*S});
  } else if(pick==='bar'){
    obstacles.push({type:'bar', x:W+120, w:30*S, h:70*S});
  } else if(pick==='tv'){
    obstacles.push({type:'tv', x:W+120, w:56*S, h:50*S, tag:'\u20B914,999'});
  } else if(pick==='fridge'){
    obstacles.push({type:'fridge', x:W+120, w:52*S, h:98*S, tag:'\u20B932,499'});
  } else { // sintex-style water tank, wide - needs a real jump
    obstacles.push({type:'tank', x:W+120, w:88*S, h:76*S, tag:'\u20B95,999'});
  }
}
function spawnCoins(){
  const baseY = GROUND - (70+Math.random()*90)*S;
  for(let i=0;i<5;i++) coins.push({x:W+120+i*44*S, y:baseY - Math.sin(i/4*Math.PI)*40*S, got:false});
}
function spawnBus(){
  const w=Math.max(300*S, W*0.42), h=150*S;
  buses.push({x:W+w+60, w, h, rv:speed*0.9+150*S, bob:0});
  honk();
  addFloat('Bus vandhiruchu! Hide! \uD83D\uDE8C', W*0.55, H*0.22, '#ffe9a8', true);
}
function spawnJet(){
  jets.push({x:W+260, y:GROUND-178*S, w:120*S, h:36*S, rv:speed*1.5+430*S, trail:0});
  whoosh();
  addFloat('LOW JET! Stay down! \u2708\uFE0F', W*0.6, GROUND-230*S, '#ffd54f', true);
}

/* ---------- update ---------- */
let lastT=performance.now();
function loop(now){
  const dt=Math.min(0.033,(now-lastT)/1000); lastT=now; tGlobal+=dt;
  if(state===ST.OVER) overT+=dt;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
function update(dt){
  for(const c of clouds){ c.x-=c.v*dt; if(c.x<-140){c.x=W+140;c.y=40+Math.random()*H*0.25;} }
  if(sayCool>0) sayCool-=dt;
  if(state!==ST.PLAY) return;

  speed += dt*7;
  dist += speed*dt*0.06;
  player.run += dt*(8+speed*0.02);

  // gravity
  player.vy += 2400*S*dt;
  player.y += player.vy*dt;
  if(player.y>=GROUND){player.y=GROUND;player.vy=0;player.jumps=0;}

  // run dust
  if(player.y>=GROUND-0.5 && Math.random()<dt*9)
    dust.push({x:px()-14*S, y:GROUND-4*S, vx:-40*S-speed*0.1, vy:-30*S-Math.random()*30*S, life:0.5, r:3+Math.random()*4});

  // buses move + hide detection
  hidden=false;
  const PXX=px();
  for(const b of buses){
    b.x -= b.rv*dt; b.bob += dt*9;
    if(b.x+40*S < PXX && PXX < b.x+b.w-40*S) hidden=true;
  }
  buses = buses.filter(b=>b.x+b.w>-80);
  if(hidden){
    gap=Math.min(420, gap+58*dt);
    if(hideCool<=0){ hideCool=3.2; say('Odravanai kandupidikka mudiyadhu \uD83D\uDE0E'); addFloat('HIDDEN \uD83D\uDE8C', PXX, player.y-200*S, '#b7f0c0', true); }
  }
  if(hideCool>0) hideCool-=dt;

  // chaser pressure (frozen while hidden)
  if(!hidden) gap -= dt*(6+speed*0.012);
  gap = Math.min(gap, 420);
  if(gap<=64){ gameOver(); return; }

  // chaser count milestones + meme replay
  const want = 1+Math.min(3,Math.floor(dist/600));
  if(want>chaserCount){ chaserCount=want; addFloat('More COD agents joined! \uD83D\uDE31', W*0.5, H*0.3,'#ff5252',true); beep(200,0.3,'sawtooth',0.1); }
  if(dist>milestone){ milestone+=500; playVoice(meme, false); }

  // spawns
  spawnT-=dt; if(spawnT<=0){ spawnObstacle(); spawnT = Math.max(0.6, 1.55 - speed/700) * (0.85+Math.random()*0.5); }
  coinT-=dt;  if(coinT<=0){ spawnCoins(); coinT = 3.5+Math.random()*3; }
  busT-=dt;   if(busT<=0){ spawnBus(); busT = 15+Math.random()*8; }
  if(dist>350){ jetT-=dt; if(jetT<=0){ spawnJet(); jetT = 18+Math.random()*14; } }

  // ground obstacles
  const pw=30*S, ph=86*S;
  for(const o of obstacles){
    o.x -= speed*dt;
    if(invulnT<=0){
      if(o.type==='hole'){
        if(o.x<PXX+pw && o.x+o.w>PXX-pw && player.y>=GROUND-2) hitObstacle(HIT_GAGS.hole);
      } else {
        const oy=GROUND-o.h;
        if(o.x<PXX+pw && o.x+o.w>PXX-pw && player.y>oy+8) hitObstacle(HIT_GAGS[o.type]||GAGS[0]);
      }
    }
  }
  obstacles = obstacles.filter(o=>o.x+o.w>-140);

  // jets - punish panic double jumps
  for(const j of jets){
    j.x -= j.rv*dt; j.trail += dt;
    if(invulnT<=0 && j.x<PXX+pw && j.x+j.w>PXX-pw && (GROUND-player.y)>140*S)
      hitObstacle(HIT_GAGS.jet);
    if(Math.random()<dt*14) dust.push({x:j.x+j.w, y:j.y+10*S, vx:60, vy:10, life:0.6, r:4+Math.random()*4, white:true});
  }
  jets = jets.filter(j=>j.x+j.w>-160);

  // coins
  for(const c of coins){
    c.x -= speed*dt;
    if(!c.got && Math.abs(c.x-PXX)<34*S && Math.abs(c.y-(player.y-70*S))<54*S){
      c.got=true; cash+=100; gap=Math.min(420,gap+34); coinStreak++;
      addFloat('+\u20B9100', c.x, c.y-20, '#ffd54f');
      if(coinStreak===5){ say('Easy money! \uD83D\uDCB0'); }
      beep(880,0.07,'sine',0.07); beep(1320,0.09,'sine',0.05);
    }
  }
  coins=coins.filter(c=>c.x>-60 && !c.got);

  if(invulnT>0) invulnT-=dt;
  if(shakeT>0) shakeT-=dt;

  // particles, floats, bubbles
  for(const p of dust){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=300*S*dt; p.life-=dt; }
  dust=dust.filter(p=>p.life>0);
  for(const f of floats){ f.y-=30*dt; f.life-=dt; }
  floats=floats.filter(f=>f.life>0);
  for(const b of bubbles){ b.life-=dt; }
  bubbles=bubbles.filter(b=>b.life>0);

  // panic line when close
  if(gap<150 && Math.random()<dt*0.7) say('Vidunga da! \uD83D\uDE05');
}
function hitObstacle(msg){
  gap-=120; invulnT=1.1; shakeT=0.35; coinStreak=0;
  speed=Math.max(240,speed*0.82);
  addFloat(msg, px()+40*S, player.y-150*S, '#ff5252', true);
  beep(160,0.25,'sawtooth',0.12);
  if(gap<=64) gameOver();
}

/* ---------- drawing ---------- */
function draw(){
  const panicking = state===ST.PLAY && gap<170 && !hidden;
  // sky
  const sky=ctx.createLinearGradient(0,0,0,GROUND);
  if(panicking){ sky.addColorStop(0,PAL.skyAP); sky.addColorStop(1,PAL.skyBP); }
  else { sky.addColorStop(0,PAL.skyA); sky.addColorStop(1,PAL.skyB); }
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,GROUND+2);
  // sun
  ctx.fillStyle= panicking? '#ff8a5c':'#fff3c4';
  ctx.beginPath(); ctx.arc(W*0.8, H*0.15, 30*S,0,7); ctx.fill();
  ctx.fillStyle= panicking? 'rgba(255,138,92,0.25)':'rgba(255,243,196,0.35)';
  ctx.beginPath(); ctx.arc(W*0.8, H*0.15, 44*S,0,7); ctx.fill();
  // clouds
  ctx.fillStyle='rgba(255,255,255,0.85)';
  for(const c of clouds){ cloud(c.x%(W+280)-140, c.y, c.s); }
  // far skyline
  const farOff = state===ST.PLAY ? (dist*10)%120 : (tGlobal*6)%120;
  ctx.fillStyle= panicking? 'rgba(70,40,80,0.5)':PAL.far;
  for(const b of skyline){
    let x = ((b.x - farOff)%(W+240)+(W+240))%(W+240)-120;
    ctx.fillRect(x, GROUND-b.h*S*0.8, b.w, b.h*S*0.8);
  }
  // mid buildings (parallax, warm muted)
  const midOff = state===ST.PLAY ? (dist*22)%190 : (tGlobal*12)%190;
  for(const b of blocks){
    let x = ((b.x - midOff)%(W+380)+(W+380))%(W+380)-190;
    const bh=b.h*S, bw=b.w;
    ctx.fillStyle= panicking? '#6b4438':PAL.mid;
    ctx.fillRect(x, GROUND-bh, bw, bh);
    ctx.fillStyle= panicking? '#57372e':PAL.midDark;
    ctx.fillRect(x, GROUND-bh, bw, 6*S);
    ctx.fillStyle= panicking? 'rgba(255,190,120,0.55)':'rgba(255,252,230,0.75)';
    const cols=Math.max(2,Math.floor(bw/(34*S))), rows=Math.max(2,Math.floor(bh/(30*S)));
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)
      ctx.fillRect(x+10*S+c*30*S, GROUND-bh+14*S+r*26*S, 12*S, 10*S);
  }
  // road
  ctx.fillStyle= panicking? '#43302f':PAL.road;
  ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle= panicking? '#543b38':PAL.roadDark;
  ctx.fillRect(0,GROUND,W,(H-GROUND)*0.18);
  // kerb
  ctx.fillStyle= panicking? '#7a5450':PAL.kerb;
  ctx.fillRect(0,GROUND,W,5*S);
  // lane dashes
  const dashOff = state===ST.PLAY ? (dist*90)%90 : (tGlobal*40)%90;
  ctx.fillStyle= panicking? '#d8b25c':PAL.lane;
  for(let x=-dashOff;x<W;x+=90) ctx.fillRect(x, GROUND+(H-GROUND)*0.5, 44, 4*S);

  ctx.save();
  if(shakeT>0){ ctx.translate((Math.random()-0.5)*10*shakeT*4,(Math.random()-0.5)*8*shakeT*4); }

  // particles behind actors
  for(const p of dust){
    ctx.globalAlpha=Math.max(0,Math.min(0.5,p.life));
    ctx.fillStyle=p.white?'#ffffff':'#cbb89a';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*S,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;

  // coins
  for(const c of coins) drawCoin(c.x,c.y);
  // obstacles
  for(const o of obstacles) drawObstacle(o);
  // jets (sky band)
  for(const j of jets) drawJet(j);
  // chasers
  if(state!==ST.MENU){
    for(let i=chaserCount-1;i>=0;i--){
      const bx = px() - gap - i*86*S;
      drawChaser(bx, GROUND, BRANDS[i%BRANDS.length], tGlobal*10+i*2);
    }
  }
  // player (bus draws after, occluding him = hiding)
  drawPlayer(px(), player?player.y:GROUND, panicking);
  // buses in foreground
  for(const b of buses) drawBus(b);

  ctx.restore();

  // gag floats
  ctx.textAlign='center';
  for(const f of floats){
    ctx.globalAlpha=Math.min(1,f.life*2);
    ctx.font='bold '+(f.big?24:16)+'px '+GAG_F;
    ctx.lineWidth=4; ctx.strokeStyle='rgba(20,26,34,0.75)';
    ctx.strokeText(f.txt,f.x,f.y); ctx.fillStyle=f.color; ctx.fillText(f.txt,f.x,f.y);
    ctx.globalAlpha=1;
  }
  // Veeramani speech bubble
  if(bubbles.length && state===ST.PLAY){
    const b=bubbles[bubbles.length-1];
    const by=(player?player.y:GROUND)-210*S;
    ctx.font='bold 15px '+HUD_F;
    const tw=ctx.measureText(b.txt).width;
    const bw2=tw+28, bh2=32;
    const bx=Math.max(8, Math.min(px()+30*S, W-bw2-18));
    ctx.globalAlpha=Math.min(1,b.life*2.5);
    ctx.fillStyle='rgba(255,255,255,0.95)';
    ctx.strokeStyle='rgba(20,26,34,0.25)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(bx-10, by-bh2, bw2, bh2, 12); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx+6,by); ctx.lineTo(bx-6,by+14); ctx.lineTo(bx+22,by); ctx.closePath();
    ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.fill();
    ctx.fillStyle=PAL.ink; ctx.textAlign='left';
    ctx.fillText(b.txt, bx+4, by-10);
    ctx.globalAlpha=1;
  }

  // HUD
  if(state===ST.PLAY){
    const y0=14;
    pill(12, y0, Math.floor(dist)+' m', '#ffffff');
    pill(12, y0+38, '\u20B9'+cash, '#ffd54f');
    // chaser distance bar
    const gw=150, gx=12, gy=y0+80;
    ctx.fillStyle='rgba(20,26,34,0.5)';
    ctx.beginPath(); ctx.roundRect(gx,gy,gw+16,30,15); ctx.fill();
    const pct=Math.max(0,Math.min(1,(gap-64)/356));
    ctx.fillStyle= hidden? '#7ce0a3' : (pct>0.5?'#7ce0a3':(pct>0.25?'#ffd54f':'#ff6b6b'));
    ctx.beginPath(); ctx.roundRect(gx+8,gy+7,Math.max(8,(gw)*pct),8,4); ctx.fill();
    ctx.font='600 10px '+HUD_F; ctx.textAlign='left'; ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.fillText(hidden?'HIDDEN - CHASERS LOST HIM':'CHASER DISTANCE', gx+8, gy+26);
  }
  if(state===ST.PLAY && hidden){
    ctx.textAlign='center';
    ctx.font='bold 15px '+HUD_F;
    const narrow=W<520;
    const t=narrow?'\uD83D\uDE8C Bus cover!':'\uD83D\uDE8C Bus cover - kandupidikka mudiyadhu';
    const tw=ctx.measureText(t).width;
    const py=narrow?54:14;
    ctx.fillStyle='rgba(20,26,34,0.55)';
    ctx.beginPath(); ctx.roundRect(W/2-tw/2-14, py, tw+28, 32, 16); ctx.fill();
    ctx.fillStyle='#b7f0c0'; ctx.fillText(t, W/2, py+21);
  }

  if(state===ST.MENU) drawMenu();
  if(state===ST.OVER) drawOver();
}
function pill(x,y,txt,color){
  ctx.font='bold 19px '+HUD_F; ctx.textAlign='left';
  const tw=ctx.measureText(txt).width;
  ctx.fillStyle='rgba(20,26,34,0.5)';
  ctx.beginPath(); ctx.roundRect(x,y,tw+24,30,15); ctx.fill();
  ctx.fillStyle=color; ctx.fillText(txt,x+12,y+21);
}
function cloud(x,y,s){
  ctx.beginPath();
  ctx.arc(x,y,22*s,0,7); ctx.arc(x+24*s,y+4*s,18*s,0,7); ctx.arc(x-24*s,y+6*s,16*s,0,7);
  ctx.fill();
}
function shadow(x,w){
  ctx.fillStyle='rgba(20,26,34,0.22)';
  ctx.beginPath(); ctx.ellipse(x,GROUND+6*S,w,7*S,0,0,7); ctx.fill();
}
function drawCoin(x,y){
  const spin=Math.abs(Math.cos(tGlobal*5+x*0.01));
  ctx.save(); ctx.translate(x,y); ctx.scale(0.35+0.65*spin,1);
  ctx.fillStyle='#ffb300'; ctx.beginPath(); ctx.arc(0,0,13*S,0,7); ctx.fill();
  ctx.fillStyle='#ffe082'; ctx.beginPath(); ctx.arc(0,0,9.5*S,0,7); ctx.fill();
  ctx.fillStyle='#8d5b00'; ctx.font='bold '+Math.round(14*S)+'px '+GAG_F; ctx.textAlign='center';
  ctx.fillText('\u20B9', 0, 5*S);
  ctx.restore();
}
function priceTag(x,y,txt){
  ctx.save();
  ctx.translate(x,y); ctx.rotate(-0.06);
  ctx.font='bold '+Math.round(11*S)+'px '+HUD_F;
  const tw=ctx.measureText('COD '+txt).width;
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.roundRect(-4,-14*S,tw+12,18*S,4); ctx.fill();
  ctx.strokeStyle='#c62828'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle='#c62828'; ctx.textAlign='left';
  ctx.fillText('COD '+txt, 2, -2*S);
  ctx.restore();
}

function drawObstacle(o){
  const u=S;
  if(o.type==='box'){
    shadow(o.x+o.w/2, o.w*0.6);
    for(let i=0;i<o.n;i++){
      const y=GROUND-44*u*(i+1);
      ctx.fillStyle='#b07a45'; ctx.fillRect(o.x,y,46*u,44*u);
      ctx.strokeStyle='#7a4f24'; ctx.lineWidth=2; ctx.strokeRect(o.x,y,46*u,44*u);
      ctx.fillStyle='#7a4f24'; ctx.fillRect(o.x+21*u,y,4*u,44*u);
      ctx.fillStyle='#fff'; ctx.fillRect(o.x+6*u,y+6*u,30*u,13*u);
      ctx.fillStyle='#c62828'; ctx.font='bold '+Math.round(10*u)+'px '+HUD_F; ctx.textAlign='center';
      ctx.fillText('COD', o.x+21*u, y+16*u);
    }
  } else if(o.type==='hole'){
    ctx.fillStyle='#20262e';
    ctx.beginPath(); ctx.ellipse(o.x+o.w/2, GROUND+5*u, o.w/2, 10*u, 0, 0, 7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.14)';
    ctx.beginPath(); ctx.ellipse(o.x+o.w/2, GROUND+3*u, o.w/2.4, 6*u, 0, 0, 7); ctx.fill();
  } else if(o.type==='bar'){
    shadow(o.x+o.w/2, o.w*0.8);
    const y=GROUND-o.h;
    ctx.fillStyle='#e85d26'; ctx.fillRect(o.x,y,o.w,o.h);
    ctx.fillStyle='#fff';
    for(let i=0;i<3;i++) ctx.fillRect(o.x,y+8*u+i*22*u,o.w,8*u);
    ctx.strokeStyle='#a03c12'; ctx.lineWidth=2; ctx.strokeRect(o.x,y,o.w,o.h);
    ctx.fillStyle='#37474f'; ctx.fillRect(o.x-4*u,GROUND-6*u,o.w+8*u,6*u);
  } else if(o.type==='tv'){
    shadow(o.x+o.w/2, o.w*0.62);
    const y=GROUND-o.h;
    // legs
    ctx.strokeStyle='#37474f'; ctx.lineWidth=3*u; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(o.x+8*u,GROUND); ctx.lineTo(o.x+12*u,y+o.h-4*u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(o.x+o.w-8*u,GROUND); ctx.lineTo(o.x+o.w-12*u,y+o.h-4*u); ctx.stroke();
    // body
    ctx.fillStyle='#45526b';
    ctx.beginPath(); ctx.roundRect(o.x,y,o.w,o.h-6*u,6*u); ctx.fill();
    // screen with static
    ctx.fillStyle='#0e1620';
    ctx.beginPath(); ctx.roundRect(o.x+5*u,y+5*u,o.w-10*u,o.h-20*u,4*u); ctx.fill();
    ctx.fillStyle='rgba(90,200,250,0.5)';
    for(let i=0;i<3;i++){ const yy=y+8*u+((tGlobal*57+i*13)%(o.h-30*u)); ctx.fillRect(o.x+7*u,yy,o.w-14*u,2*u); }
    // knobs
    ctx.fillStyle='#cfd8dc'; ctx.fillRect(o.x+8*u,y+o.h-13*u,8*u,4*u);
    ctx.fillRect(o.x+20*u,y+o.h-13*u,8*u,4*u);
    // antenna
    ctx.strokeStyle='#37474f'; ctx.lineWidth=2*u;
    ctx.beginPath(); ctx.moveTo(o.x+o.w*0.5,y); ctx.lineTo(o.x+o.w*0.32,y-16*u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(o.x+o.w*0.5,y); ctx.lineTo(o.x+o.w*0.68,y-18*u); ctx.stroke();
    if(o.tag) priceTag(o.x+o.w-8*u, y-4*u, o.tag);
  } else if(o.type==='fridge'){
    shadow(o.x+o.w/2, o.w*0.62);
    const y=GROUND-o.h;
    ctx.fillStyle='#dfe7ec';
    ctx.beginPath(); ctx.roundRect(o.x,y,o.w,o.h,7*u); ctx.fill();
    ctx.strokeStyle='#9aa8b2'; ctx.lineWidth=2; ctx.stroke();
    // door split + handles
    ctx.strokeStyle='#9aa8b2'; ctx.beginPath(); ctx.moveTo(o.x,y+o.h*0.34); ctx.lineTo(o.x+o.w,y+o.h*0.34); ctx.stroke();
    ctx.fillStyle='#7d8c96';
    ctx.fillRect(o.x+6*u,y+10*u,4*u,16*u);
    ctx.fillRect(o.x+6*u,y+o.h*0.34+8*u,4*u,24*u);
    // magnet + note
    ctx.fillStyle='#e05252'; ctx.beginPath(); ctx.arc(o.x+o.w*0.7,y+o.h*0.18,3*u,0,7); ctx.fill();
    ctx.fillStyle='#fff7cc'; ctx.fillRect(o.x+o.w*0.5,y+o.h*0.45,16*u,12*u);
    ctx.strokeStyle='#d8c96a'; ctx.lineWidth=1; ctx.strokeRect(o.x+o.w*0.5,y+o.h*0.45,16*u,12*u);
    if(o.tag) priceTag(o.x+2*u, y-6*u, o.tag);
  } else { // tank
    shadow(o.x+o.w/2, o.w*0.55);
    const y=GROUND-o.h;
    ctx.fillStyle='#232a31';
    ctx.beginPath(); ctx.roundRect(o.x,y,o.w,o.h,14*u); ctx.fill();
    // ribs
    ctx.strokeStyle='rgba(255,255,255,0.16)'; ctx.lineWidth=3*u;
    for(let i=1;i<4;i++){
      ctx.beginPath(); ctx.moveTo(o.x+4*u,y+i*o.h/4); ctx.lineTo(o.x+o.w-4*u,y+i*o.h/4); ctx.stroke();
    }
    // lid
    ctx.fillStyle='#171d22';
    ctx.beginPath(); ctx.ellipse(o.x+o.w/2,y+2*u,16*u,6*u,0,0,7); ctx.fill();
    ctx.fillStyle='#2e3840';
    ctx.beginPath(); ctx.ellipse(o.x+o.w/2,y,14*u,5*u,0,0,7); ctx.fill();
    // brand-ish mark
    ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.font='bold '+Math.round(10*u)+'px '+HUD_F; ctx.textAlign='center';
    ctx.fillText('SINTAX', o.x+o.w/2, y+o.h*0.55);
    if(o.tag) priceTag(o.x+o.w*0.5, y-12*u, o.tag);
  }
}
function drawJet(j){
  const u=S;
  ctx.save(); ctx.translate(j.x, j.y);
  // body
  ctx.fillStyle='#8d99a6';
  ctx.beginPath();
  ctx.moveTo(0,10*u); ctx.lineTo(j.w*0.25,2*u); ctx.lineTo(j.w*0.72,2*u);
  ctx.lineTo(j.w,12*u); ctx.lineTo(j.w*0.72,20*u); ctx.lineTo(j.w*0.2,20*u);
  ctx.closePath(); ctx.fill();
  // wing + tail
  ctx.fillStyle='#6f7b88';
  ctx.beginPath(); ctx.moveTo(j.w*0.35,12*u); ctx.lineTo(j.w*0.55,34*u); ctx.lineTo(j.w*0.62,34*u); ctx.lineTo(j.w*0.52,12*u); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(j.w*0.08,8*u); ctx.lineTo(j.w*0.2,-8*u); ctx.lineTo(j.w*0.28,-8*u); ctx.lineTo(j.w*0.24,8*u); ctx.closePath(); ctx.fill();
  // canopy
  ctx.fillStyle='#bfe8ff';
  ctx.beginPath(); ctx.ellipse(j.w*0.72,6*u,9*u,5*u,-0.1,0,7); ctx.fill();
  // afterburner
  ctx.fillStyle= (Math.floor(tGlobal*18)%2===0)?'#ffb54d':'#ff7b3d';
  ctx.beginPath(); ctx.moveTo(2,12*u); ctx.lineTo(-16*u,9*u); ctx.lineTo(-16*u,15*u); ctx.closePath(); ctx.fill();
  ctx.restore();
  priceTag(j.x+j.w*0.45, j.y-6*u, '\u20B999,99,999');
}

function drawBus(b){
  const u=S;
  const x=b.x, y=GROUND-b.h+6*u;
  const bob=Math.sin(b.bob)*1.5*u;
  ctx.save(); ctx.translate(0,bob);
  shadow(x+b.w/2, b.w*0.48);
  // body - cream with green skirt (state transport look)
  ctx.fillStyle=PAL.cream;
  ctx.beginPath(); ctx.roundRect(x,y,b.w,b.h-26*u,10*u); ctx.fill();
  ctx.fillStyle=PAL.busGreen;
  ctx.fillRect(x,y+b.h-52*u,b.w,26*u);
  ctx.beginPath(); ctx.roundRect(x,y+b.h-34*u,b.w,10*u,4*u); ctx.fill();
  // roof stripe
  ctx.fillStyle=PAL.busGreen;
  ctx.fillRect(x+6*u,y+8*u,b.w-12*u,5*u);
  // windows with passengers
  const nw=Math.floor((b.w-40*u)/(46*u));
  for(let i=0;i<nw;i++){
    const wx=x+18*u+i*46*u, wy=y+20*u, ww=36*u, wh=30*u;
    ctx.fillStyle='#bfe3f0';
    ctx.beginPath(); ctx.roundRect(wx,wy,ww,wh,4*u); ctx.fill();
    ctx.strokeStyle='rgba(20,26,34,0.3)'; ctx.lineWidth=1.5; ctx.stroke();
    if((i*7+Math.floor(b.x/50))%3!==0){
      ctx.fillStyle='#5a6a78';
      ctx.beginPath(); ctx.arc(wx+ww/2,wy+wh-12*u,6*u,0,7); ctx.fill();
      ctx.fillRect(wx+ww/2-7*u,wy+wh-8*u,14*u,8*u);
    }
  }
  // route board
  ctx.fillStyle='#1d2733';
  ctx.beginPath(); ctx.roundRect(x+b.w-86*u,y-16*u,80*u,18*u,4*u); ctx.fill();
  ctx.fillStyle='#ffd54f'; ctx.font='bold '+Math.round(12*u)+'px '+HUD_F; ctx.textAlign='center';
  ctx.fillText('63-B EXP', x+b.w-46*u, y-2*u);
  // number plate
  ctx.fillStyle='#fff'; ctx.fillRect(x+10*u,y+b.h-48*u,52*u,14*u);
  ctx.fillStyle='#111'; ctx.font='bold '+Math.round(9*u)+'px '+HUD_F;
  ctx.fillText('TN 63 ODU', x+36*u, y+b.h-37*u);
  // door
  ctx.strokeStyle='rgba(20,26,34,0.35)'; ctx.lineWidth=2;
  ctx.strokeRect(x+8*u,y+20*u,26*u,b.h-72*u);
  // headlight
  ctx.fillStyle='#fff59d'; ctx.beginPath(); ctx.arc(x+4*u,y+b.h-44*u,4*u,0,7); ctx.fill();
  // wheels
  for(const wx of [x+b.w*0.2, x+b.w*0.78]){
    ctx.fillStyle='#20262e'; ctx.beginPath(); ctx.arc(wx,GROUND-2*u,16*u,0,7); ctx.fill();
    ctx.fillStyle='#8d99a6'; ctx.beginPath(); ctx.arc(wx,GROUND-2*u,7*u,0,7); ctx.fill();
  }
  ctx.restore();
}
function drawPlayer(x,y,panicking){
  const run = player?player.run:0;
  const airborne = y<GROUND-2;
  const legA = airborne? 0.9 : Math.sin(run)*0.9;
  const u=S;
  shadow(x, 26*u);
  ctx.save();
  if(player && invulnT>0 && Math.floor(tGlobal*14)%2===0) ctx.globalAlpha=0.45;
  const jx = panicking? (Math.random()-0.5)*4 : 0;
  ctx.translate(x+jx, y);
  // legs
  ctx.strokeStyle='#2c3e50'; ctx.lineWidth=7*u; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,-38*u); ctx.lineTo(Math.sin(legA)*16*u, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-38*u); ctx.lineTo(Math.sin(legA+Math.PI)*16*u, 0); ctx.stroke();
  // body
  ctx.fillStyle='#1a9bb5';
  ctx.beginPath(); ctx.roundRect(-14*u,-78*u,28*u,44*u,8*u); ctx.fill();
  ctx.fillStyle='#e8f6f8'; ctx.fillRect(-8*u,-78*u,16*u,7*u);
  // arms
  ctx.strokeStyle='#0f6d80'; ctx.lineWidth=6*u;
  ctx.beginPath(); ctx.moveTo(-10*u,-70*u); ctx.lineTo(-10*u+Math.sin(legA+Math.PI)*14*u, -52*u); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10*u,-70*u); ctx.lineTo(10*u+Math.sin(legA)*14*u, -52*u); ctx.stroke();
  // head (real face)
  const hw=62*u, hh=93*u;
  const bob = airborne? -4*u : Math.abs(Math.sin(run))*3*u;
  const tilt = panicking? Math.sin(tGlobal*30)*0.12 : Math.sin(run*0.5)*0.05;
  ctx.save();
  ctx.translate(0,-78*u-hh/2+6*u-bob);
  ctx.rotate(tilt);
  if(headReady) ctx.drawImage(headImg, -hw/2, -hh/2, hw, hh);
  else { ctx.fillStyle='#f1c27d'; ctx.beginPath(); ctx.ellipse(0,0,hw/2,hh/2,0,0,7); ctx.fill(); }
  ctx.restore();
  if(panicking){
    ctx.strokeStyle='#ffeb3b'; ctx.lineWidth=3*u;
    for(let i=-1;i<=1;i++){
      ctx.beginPath(); ctx.moveTo(i*18*u,-160*u); ctx.lineTo(i*24*u,-176*u); ctx.stroke();
    }
  }
  ctx.restore();
}
function drawChaser(x,y,brand,phase){
  if(x<-200) return;
  const u=S;
  const legA=Math.sin(phase)*1.0;
  shadow(x, 22*u);
  ctx.save(); ctx.translate(x,y);
  // legs
  ctx.strokeStyle='#37474f'; ctx.lineWidth=6*u; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,-30*u); ctx.lineTo(Math.sin(legA)*13*u,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-30*u); ctx.lineTo(Math.sin(legA+Math.PI)*13*u,0); ctx.stroke();
  // backpack box
  ctx.fillStyle=brand.box;
  ctx.beginPath(); ctx.roundRect(-26*u,-84*u,22*u,30*u,4*u); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=2; ctx.stroke();
  // body
  ctx.fillStyle=brand.body;
  ctx.beginPath(); ctx.roundRect(-11*u,-64*u,22*u,36*u,6*u); ctx.fill();
  // reaching arm (droopy when confused)
  ctx.strokeStyle=brand.body; ctx.lineWidth=5*u;
  if(hidden){
    ctx.beginPath(); ctx.moveTo(8*u,-56*u); ctx.lineTo(16*u,-40*u); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(8*u,-56*u); ctx.lineTo(24*u,-50*u+Math.sin(phase*2)*3*u); ctx.stroke();
  }
  // head + cap
  ctx.fillStyle='#f1c27d'; ctx.beginPath(); ctx.arc(0,-72*u,10*u,0,7); ctx.fill();
  ctx.fillStyle=brand.cap;
  ctx.beginPath(); ctx.arc(0,-75*u,10*u,Math.PI,0); ctx.fill();
  ctx.fillRect(0,-76*u,14*u,4*u);
  ctx.fillStyle='#000'; ctx.fillRect(-1*u,-73*u,3*u,3*u);
  // name tag / confusion
  ctx.textAlign='center';
  if(hidden){
    ctx.font='bold '+Math.round(18*u)+'px '+GAG_F;
    ctx.lineWidth=4; ctx.strokeStyle='rgba(20,26,34,0.75)';
    const qx=Math.sin(tGlobal*6+phase)*4*u;
    ctx.strokeText('?', qx, -96*u); ctx.fillStyle='#ffd54f'; ctx.fillText('?', qx, -96*u);
  } else {
    ctx.font='bold '+Math.round(12*u)+'px '+HUD_F;
    ctx.lineWidth=3; ctx.strokeStyle='rgba(20,26,34,0.75)';
    ctx.strokeText(brand.name, -8*u, -94*u);
    ctx.fillStyle='#fff'; ctx.fillText(brand.name, -8*u, -94*u);
  }
  ctx.restore();
}

function drawMenu(){
  ctx.fillStyle='rgba(16,22,30,0.68)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  const cx=W/2;
  ctx.font='bold '+Math.round(46*S)+'px '+GAG_F;
  ctx.lineWidth=8; ctx.strokeStyle='rgba(0,0,0,0.85)';
  ctx.strokeText('VEERAMANI RUN', cx, H*0.24);
  const grad=ctx.createLinearGradient(0,H*0.19,0,H*0.28);
  grad.addColorStop(0,'#ffd54f'); grad.addColorStop(1,'#ff8a5c');
  ctx.fillStyle=grad; ctx.fillText('VEERAMANI RUN', cx, H*0.24);
  ctx.font='600 '+Math.round(18*S)+'px '+HUD_F;
  ctx.fillStyle='#ffd54f';
  ctx.fillText('C O D   C H A S E', cx, H*0.24+34*S);
  ctx.font=Math.round(16*S)+'px '+HUD_F;
  ctx.fillStyle='rgba(255,255,255,0.85)';
  ctx.fillText('The delivery boys want their COD money.', cx, H*0.4);
  ctx.fillText('Veeramani is not paying today.', cx, H*0.4+24*S);
  const blink = Math.sin(tGlobal*5)>-0.2;
  if(blink){
    ctx.font='bold '+Math.round(22*S)+'px '+HUD_F;
    ctx.fillStyle='#7ce0a3';
    ctx.fillText('TAP TO RUN', cx, H*0.56);
  }
  ctx.font=Math.round(14*S)+'px '+HUD_F;
  ctx.fillStyle='rgba(255,255,255,0.65)';
  ctx.fillText('Tap / Space = jump (double-tap = double jump)', cx, H*0.64);
  ctx.fillText('Grab \u20B9 to buy distance. Dodge TVs, fridges, tanks.', cx, H*0.64+22*S);
  ctx.fillText('Hide behind buses \uD83D\uDE8C - stay low under jets \u2708\uFE0F', cx, H*0.64+44*S);
  if(best>0){ ctx.fillStyle='#ffd54f'; ctx.fillText('Best: '+best+' m', cx, H*0.78); }
  ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.fillText('a meme game - made for fun, not real footage', cx, H*0.92);
}
function drawOver(){
  ctx.fillStyle='rgba(28,8,8,0.62)'; ctx.fillRect(0,0,W,H);
  const cx=W/2;
  ctx.textAlign='center';
  ctx.font='bold '+Math.round(40*S)+'px '+GAG_F;
  ctx.lineWidth=8; ctx.strokeStyle='rgba(0,0,0,0.85)';
  ctx.strokeText('CAUGHT! \uD83D\uDE2D', cx, H*0.3);
  ctx.fillStyle='#ff6b6b'; ctx.fillText('CAUGHT! \uD83D\uDE2D', cx, H*0.3);
  ctx.font='600 '+Math.round(17*S)+'px '+HUD_F;
  ctx.fillStyle='#fff';
  ctx.fillText('COD payment of \u20B9'+(999+Math.floor(dist))+' force-collected.', cx, H*0.3+40*S);
  ctx.font=Math.round(22*S)+'px '+HUD_F;
  ctx.fillStyle='#ffd54f';
  ctx.fillText(Math.floor(dist)+' m   \u2022   \u20B9'+cash, cx, H*0.46);
  if(Math.floor(dist)>=best){ ctx.fillStyle='#7ce0a3'; ctx.font='bold '+Math.round(18*S)+'px '+HUD_F; ctx.fillText('NEW BEST!', cx, H*0.46+30*S); }
  else { ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.font=Math.round(16*S)+'px '+HUD_F; ctx.fillText('Best: '+best+' m', cx, H*0.46+30*S); }
  const blink = Math.sin(tGlobal*5)>-0.2;
  if(blink){ ctx.font='bold '+Math.round(20*S)+'px '+HUD_F; ctx.fillStyle='#fff'; ctx.fillText('TAP TO RUN AGAIN', cx, H*0.62); }
  ctx.font=Math.round(14*S)+'px '+HUD_F; ctx.fillStyle='rgba(255,200,200,0.7)';
  ctx.fillText('"Odravanai kandupidikka mudiyadhu... aana indha delivery boys vera."', cx, H*0.7);
}

if(typeof CanvasRenderingContext2D!=='undefined' && !CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};
}
reset();
requestAnimationFrame(loop);
</script></body></html>
